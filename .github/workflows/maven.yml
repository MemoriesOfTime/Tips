# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-java-with-maven

# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

name: Java CI with Maven

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v5
    - name: Set up JDK 8
      uses: actions/setup-java@v5
      with:
        java-version: 8
        distribution: 'temurin'
    - name: Cache Maven packages
      uses: actions/cache@v5
      with:
        path: ~/.m2
        key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
        restore-keys: ${{ runner.os }}-m2
    - name: Build projects
      run: mvn -B package --file pom.xml
    - run: mkdir staging && cp target/*.jar staging
    - uses: actions/upload-artifact@v5
      with:
        name: Tips
        path: staging
    # 更新 MineBBS 资源信息（结果彻底忽略，失败不影响构建）
    - name: Update MineBBS infomation
      if: success() && github.event_name == 'push' && github.repository == 'MemoriesOfTime/Tips' && contains(github.ref_name, 'master')
      env:
        MINEBBS_API_KEY: ${{ secrets.MINEBBS_API_KEY }}
      run: |
        sha_short=$(git rev-parse --short HEAD)
        changelog=$(git log -1 --pretty=%s)
        time=$(TZ=Asia/Shanghai date +'%Y/%m/%d-%H:%M:%S')
        payload=$(jq -n --arg title "${{ github.ref_name }}-$sha_short" --arg desc "$changelog" --arg ver "$time" '{title: $title, description: $desc, new_version: $ver, file_url: "https://motci.cn/job/Tips/"}')
        curl -sS -o /dev/null -X POST 'https://api.minebbs.com/api/openapi/v1/resources/796/update' \
          -H "Authorization: Bearer ${MINEBBS_API_KEY}" \
          -H 'Content-Type: application/json' \
          -d "$payload" || true
